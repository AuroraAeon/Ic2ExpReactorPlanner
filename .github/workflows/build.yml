name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build, verify, and package
        if: runner.os != 'Windows'
        run: ./gradlew --no-daemon build
      - name: Build, verify, and package on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reactor-planner-${{ runner.os }}
          path: |
            build/libs/*.jar
            build/distributions/*.zip
            build/test-results/**/*.xml
