plugins {
    id 'application'
}

version = providers.gradleProperty('erpVersion').get()

application {
    mainClass = 'Ic2ExpReactorPlanner.ReactorPlannerFrame'
}

sourceSets {
    main {
        java.setSrcDirs(['src'])
        resources {
            setSrcDirs(['src'])
            include 'assets/**', 'Ic2ExpReactorPlanner/*.properties'
        }
    }
    test {
        java.setSrcDirs(['test'])
        resources.setSrcDirs(['testResources'])
    }
    benchmark {
        java.setSrcDirs(['benchmark'])
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('test', Test) {
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'
}

tasks.register('testChinese', Test) {
    description = 'Runs the same suite in the Simplified Chinese locale.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'user.language', 'zh'
    systemProperty 'user.country', 'CN'
    shouldRunAfter tasks.named('test')
}

tasks.named('check') {
    dependsOn tasks.named('testChinese')
}

tasks.named('jar', Jar) {
    manifest.attributes 'Main-Class': application.mainClass.get(), 'Implementation-Version': project.version
}

tasks.register('benchmark', JavaExec) {
    group = 'verification'
    description = 'Measures simulation throughput and bytes allocated per run.'
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'Ic2ExpReactorPlanner.SimulatorBenchmark'
    jvmArgs '-Xms256m', '-Xmx768m'
}

tasks.register('benchmarkIndependentLayouts', JavaExec) {
    group = 'verification'
    description = 'Compares one, two, and four concurrent GTNH layout simulations.'
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'Ic2ExpReactorPlanner.IndependentLayoutsBenchmark'
    jvmArgs '-Xms256m', '-Xmx768m'
}
